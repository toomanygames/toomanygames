<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DougHub Chat</title>

<link rel="icon" href="DougHub.ico" type="image/x-icon">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(99, 102, 241, 0.18), transparent 35%),
    radial-gradient(circle at bottom right, rgba(168, 85, 247, 0.14), transparent 35%),
    #02040a;
  color: white;
}

body {
  min-height: 100vh;
}

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(2,4,10,0.78);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: white;
  font-weight: 800;
  font-size: 21px;
}

.brand-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366f1, #a855f7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 8px 30px rgba(99,102,241,0.25);
}

.back-button {
  text-decoration: none;
  color: #c7c9d9;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 700;
  transition: 0.2s;
}

.back-button:hover {
  background: rgba(255,255,255,0.1);
  color: white;
}

main {
  width: min(1000px, calc(100% - 28px));
  margin: 30px auto;
}

.page-title {
  margin-bottom: 18px;
}

.page-title h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 42px);
  letter-spacing: -1px;
}

.page-title p {
  margin: 7px 0 0;
  color: #9da2b8;
}

.chat-container {
  height: min(680px, calc(100vh - 170px));
  min-height: 480px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px;
  background: rgba(13,17,39,0.72);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 80px rgba(0,0,0,0.35);
}

.chat-top {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.chat-status {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #aeb4c9;
  font-size: 14px;
}

.status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 12px rgba(74,222,128,0.6);
}

.username-display {
  color: #c4b5fd;
  font-weight: 700;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.messages::-webkit-scrollbar {
  width: 8px;
}

.messages::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.12);
  border-radius: 20px;
}

.message {
  max-width: 78%;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.message.mine {
  align-self: flex-end;
  align-items: flex-end;
}

.message.theirs {
  align-self: flex-start;
  align-items: flex-start;
}

.message-header {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #9da2b8;
  font-size: 12px;
}

.message.mine .message-header {
  flex-direction: row-reverse;
}

.message-username {
  font-weight: 800;
  color: #c4b5fd;
}

.message-time {
  color: #777d95;
}

.message-bubble {
  padding: 11px 15px;
  border-radius: 16px;
  line-height: 1.45;
  word-break: break-word;
  white-space: pre-wrap;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.08);
}

.message.mine .message-bubble {
  background: linear-gradient(
    135deg,
    rgba(99,102,241,0.9),
    rgba(124,58,237,0.9)
  );
  border-color: rgba(167,139,250,0.35);
  border-bottom-right-radius: 5px;
}

.message.theirs .message-bubble {
  border-bottom-left-radius: 5px;
}

.empty {
  margin: auto;
  text-align: center;
  color: #858ba3;
}

.empty-icon {
  font-size: 42px;
  margin-bottom: 10px;
}

.composer {
  border-top: 1px solid rgba(255,255,255,0.08);
  padding: 15px;
  display: flex;
  gap: 10px;
  background: rgba(2,4,10,0.3);
}

#messageInput {
  flex: 1;
  min-width: 0;
  resize: none;
  height: 48px;
  max-height: 130px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  background: rgba(255,255,255,0.06);
  color: white;
  padding: 13px 15px;
  font: inherit;
  outline: none;
}

#messageInput::placeholder {
  color: #73798f;
}

#messageInput:focus {
  border-color: rgba(129,140,248,0.75);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

#sendButton {
  border: 0;
  border-radius: 14px;
  padding: 0 21px;
  min-width: 80px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  font-weight: 800;
  cursor: pointer;
  transition: 0.2s;
}

#sendButton:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
}

#sendButton:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.error {
  display: none;
  margin: 12px 20px 0;
  padding: 11px 13px;
  border-radius: 12px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.25);
  color: #fca5a5;
  font-size: 14px;
}

@media (max-width: 600px) {
  header {
    padding: 0 15px;
  }

  .brand {
    font-size: 18px;
  }

  .brand-icon {
    width: 36px;
    height: 36px;
  }

  .back-button {
    padding: 9px 12px;
    font-size: 13px;
  }

  main {
    width: calc(100% - 16px);
    margin: 16px auto;
  }

  .chat-container {
    height: calc(100vh - 145px);
    min-height: 430px;
    border-radius: 18px;
  }

  .messages {
    padding: 15px;
  }

  .message {
    max-width: 88%;
  }

  .composer {
    padding: 10px;
  }

  #sendButton {
    min-width: 62px;
    padding: 0 13px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="brand">
    <span class="brand-icon">D</span>
    <span>DougHub Chat</span>
  </a>

  <a href="index.html" class="back-button">← DougHub</a>
</header>

<main>

  <div class="page-title">
    <h1>Community Chat</h1>
    <p>Talk with other DougHub users.</p>
  </div>

  <div class="chat-container">

    <div class="chat-top">
      <div class="chat-status">
        <span class="status-dot"></span>
        <span>Live Chat</span>
      </div>

      <div class="username-display" id="currentUsername">
        Loading...
      </div>
    </div>

    <div class="error" id="errorBox"></div>

    <div class="messages" id="messages">
      <div class="empty">
        <div class="empty-icon">💬</div>
        Loading chat...
      </div>
    </div>

    <form class="composer" id="messageForm">
      <textarea
        id="messageInput"
        maxlength="1000"
        placeholder="Type a message..."
        autocomplete="off"
        required
      ></textarea>

      <button type="submit" id="sendButton">
        Send
      </button>
    </form>

  </div>

</main>

<script>
const SUPABASE_URL = "https://agsqdqcsmsppcdqxlppj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Oq1WvEHgoHcjmCBGbEnoYQ_BqYA1p52";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const messagesEl = document.getElementById("messages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const currentUsernameEl = document.getElementById("currentUsername");
const errorBox = document.getElementById("errorBox");

let currentUser = null;
let currentUsername = "Anonymous";
let loadingMessages = false;

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = "block";
}

function hideError() {
  errorBox.style.display = "none";
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

function formatTime(dateString) {
  const date = new Date(dateString);

  return date.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

function renderMessages(messages) {
  if (!messages.length) {
    messagesEl.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💬</div>
        <div>No messages yet.</div>
        <div>Be the first to say something!</div>
      </div>
    `;
    return;
  }

  messagesEl.innerHTML = "";

  messages.forEach(message => {
    const mine = message.user_id === currentUser.id;

    const wrapper = document.createElement("div");
    wrapper.className = `message ${mine ? "mine" : "theirs"}`;

    wrapper.innerHTML = `
      <div class="message-header">
        <span class="message-username">
          @${escapeHtml(message.username)}
        </span>

        <span class="message-time">
          ${formatTime(message.created_at)}
        </span>
      </div>

      <div class="message-bubble">
        ${escapeHtml(message.message)}
      </div>
    `;

    messagesEl.appendChild(wrapper);
  });

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function loadMessages() {
  if (loadingMessages) return;

  loadingMessages = true;

  const {
    data,
    error
  } = await supabaseClient
    .from("chat_messages")
    .select("id, user_id, username, message, created_at")
    .order("created_at", {
      ascending: true
    })
    .limit(200);

  loadingMessages = false;

  if (error) {
    showError("Could not load chat messages.");
    console.error(error);
    return;
  }

  hideError();
  renderMessages(data || []);
}

async function loadAccount() {
  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "log-in.html?redirect=chat.html";
    return;
  }

  currentUser = session.user;

  const {
    data: profile,
    error
  } = await supabaseClient
    .from("profiles")
    .select("username")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    console.error(error);
  }

  if (profile && profile.username) {
    currentUsername = profile.username;
  } else {
    currentUsername =
      currentUser.user_metadata?.username ||
      "Anonymous";
  }

  currentUsernameEl.textContent = "@" + currentUsername;

  await loadMessages();

  startChatRefresh();
}

async function sendMessage() {
  const text = messageInput.value.trim();

  if (!text) return;

  if (!currentUser) {
    window.location.href = "log-in.html?redirect=chat.html";
    return;
  }

  if (text.length > 1000) {
    showError("Messages can only be 1000 characters long.");
    return;
  }

  sendButton.disabled = true;
  messageInput.disabled = true;
  hideError();

  const {
    error
  } = await supabaseClient
    .from("chat_messages")
    .insert({
      user_id: currentUser.id,
      username: currentUsername,
      message: text
    });

  sendButton.disabled = false;
  messageInput.disabled = false;
  messageInput.focus();

  if (error) {
    console.error(error);
    showError("Could not send your message.");
    return;
  }

  messageInput.value = "";

  await loadMessages();
}

messageForm.addEventListener("submit", async event => {
  event.preventDefault();
  await sendMessage();
});

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    messageForm.requestSubmit();
  }
});

function startChatRefresh() {
  setInterval(async () => {
    if (document.visibilityState === "visible") {
      await loadMessages();
    }
  }, 2000);
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  if (!session) {
    window.location.href = "log-in.html?redirect=chat.html";
  }
});

loadAccount();
</script>

</body>
</html>
