<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DougHub - Moved</title>
<link rel="icon" href="https://doughub.online/DougHub.ico" type="image/x-icon">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;

        radial-gradient(circle at top, rgba(99,102,241,.18), transparent 45%),

}

body {
    min-height: 100vh;
    display: flex;

    justify-content: center;

.card {
    width: min(700px, 100%);

    padding: 55px 40px;

    border-radius: 24px;
    background: rgba(13,17,39,.78);
    box-shadow: 0 25px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(18px);
}

h1 {
    margin: 0 0 16px;
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 800;
    letter-spacing: -1.5px;
}

p {
    margin: 0;
    color: #aeb5d4;
    font-size: 15px;
}

a {
    color: #818cf8;
    font-weight: 700;
    text-decoration: none;
    transition: .2s;
}

a:hover {
    color: #a855f7;
    text-decoration: underline;
}

</head>

<body>
    <main class="card">
        <h1>This website has permanently moved to a new domain.</h1>
