<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Pig Clicker</title>
  <script src="../display.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #fef3c7 0%, #f9a8d4 40%, #fdba74 100%);
      color: #2f1b12;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom));
    }

    .screen {
      width: min(980px, 100%);
      height: min(100vh - 24px, 860px);
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(88,38,20,0.12);
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(70,30,15,0.22);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.18);
      padding: 12px 16px;
      border-bottom: 1px solid rgba(90,40,20,0.08);
      font-weight: 800;
      gap: 10px;
    }

    .coins {
      font-size: clamp(20px, 3vw, 30px);
      letter-spacing: 0.04em;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 18px;
      padding: 10px 18px;
      font-weight: 800;
      font-size: 16px;
      background: #fff7ed;
      color: #3b2319;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
      cursor: pointer;
    }

    .content {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    .left {
      flex: 1.2;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .pig-wrap {
      width: min(70vw, 320px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      user-select: none;
      position: relative;
    }

    .pig {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: clamp(110px, 22vw, 210px);
      border-radius: 32px;
      background: radial-gradient(circle at 30% 30%, #fff7ed 0%, #fde68a 18%, #f3d5ab 30%, #f8c77a 100%);
      border: 3px solid rgba(90,40,20,0.12);
      box-shadow: inset 0 12px 24px rgba(255,255,255,0.5), 0 18px 35px rgba(116, 63, 17, 0.18);
      transition: transform 0.08s ease;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
      cursor: pointer;
    }

    .pig:active {
      transform: scale(0.96);
    }

    .pig::before {
      content: "";
      position: absolute;
      width: 50%;
      height: 28%;
      left: 25%;
      top: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      filter: blur(10px);
    }

    .burst {
      position: absolute;
      font-size: 28px;
      font-weight: 900;
      color: #7c2d12;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
      z-index: 5;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(10px) scale(0.9);
      }

      100% {
        opacity: 0;
        transform: translateY(-52px) scale(1.3);
      }
    }

    .tap {
      font-size: clamp(20px, 3vw, 30px);
      font-weight: 900;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .fever-label {
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      opacity: 0.8;
    }

    .fever-hud {
      position: fixed;
      left: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
      width: min(220px, 42vw);
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .fever-hud .fever-label {
      text-align: left;
      color: #7c2d12;
    }

    .fever-bar {
      width: 100%;
      height: 14px;
      background: rgba(255,255,255,0.4);
      border: 1px solid rgba(90,40,20,0.18);
      border-radius: 999px;
      overflow: hidden;
    }

    .fever-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #facc15);
      transition: width 0.15s ease;
    }

    .right {
      width: min(38vw, 390px);
      background: rgba(255,255,255,0.12);
      border-left: 1px solid rgba(90,40,20,0.08);
      padding: 16px 14px 20px;
      overflow: auto;
    }

    .panel {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 20px;
      padding: 12px 12px 10px;
      margin-bottom: 12px;
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .upg {

      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 14px;
      padding: 10px 10px;
      margin-bottom: 8px;
      min-height: 62px;
    }

    .upg.locked {
      opacity: 0.48;
    }

    .upg-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .upg-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: rgba(255,255,255,0.34);
      border: 1px solid rgba(90,40,20,0.10);
      border-radius: 10px;
    }

    .upg-details {
      min-width: 0;
    }

    .upg-name {
      font-weight: 800;
      font-size: 15px;
    }

    .upg-cost {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .upg-btn {
      border: none;
      background: linear-gradient(180deg, #facc15, #f59e0b);
      color: #3b2319;
      border-radius: 12px;
      font-weight: 900;
      min-width: 72px;
      padding: 10px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .upg-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .rebirth-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(180deg, #c084fc, #9333ea);
      color: white;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(126,34,206,0.25);
    }

    .rebirth-btn.space-ready {
      background: linear-gradient(180deg, #4ade80, #16a34a);
      box-shadow: 0 8px 18px rgba(22,163,74,0.28);
    }

    .rebirth-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .space-note {
      text-align: center;
      font-size: 11px;
      opacity: 0.75;
      margin-top: 7px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .stat {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(90,40,20,0.08);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      font-size: 12px;
    }

    .stat strong {
      display: block;
      font-size: 18px;
      margin-top: 2px;
    }

    .achievement {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      border: 1px solid rgba(90,40,20,0.08);
      padding: 8px 10px;
      margin-bottom: 8px;

    .achievement.locked {

    }

    .achievement .title {
      font-weight: 800;
      font-size: 14px;
    }

    .achievement .reward {
      font-size: 11px;
      opacity: 0.8;
    }

    .achievement .badge {
      font-size: 18px;
    }

    @media (max-width: 700px) {
      .content {
        flex-direction: column;
      }

      .right {
        width: 100%;
        border-left: none;
        border-top: 1px solid rgba(90,40,20,0.08);
      }

      .left {
        padding-bottom: 8px;
      }
    }
  </style>
</head>

    let audioCtx = null;
    let lastStatsSave = 0;

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }

      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type, gainValue = 0.04, delay = 0) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;

      gain.gain.value = 0.0001;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime + delay;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(gainValue, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    function playClickSfx() {
      ensureAudio();
      playTone(220, 0.08, 'square', 0.03);
      playTone(330, 0.06, 'triangle', 0.02, 0.04);
    }

    function playBuySfx() {
      ensureAudio();
      playTone(988, 0.07, 'square', 0.04);
      playTone(1319, 0.09, 'square', 0.035, 0.05);
      playTone(1760, 0.1, 'triangle', 0.03, 0.1);
    }

    function playOinkSfx() {
      ensureAudio();

      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      gain.gain.value = 0.0001;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.06, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

      osc.start(now);
      osc.stop(now + 0.25);
    }

      ]

    let state = JSON.parse(JSON.stringify(defaultState));

    function loadState() {
      const raw = localStorage.getItem(saveKey);

      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);

        state = {
          ...JSON.parse(JSON.stringify(defaultState)),
          ...parsed
        };

        state.upgrades = defaultState.upgrades.map((base) => {
          const saved = (parsed.upgrades || []).find((u) => u.id === base.id);

          return {
            ...base,
            owned: saved?.owned ?? base.owned
          };
        });

        state.achievementDefs = defaultState.achievementDefs;
        state.achievements = parsed.achievements || {};
        state.readyAchievements = parsed.readyAchievements || {};
        state.spaceUnlocked = !!parsed.spaceUnlocked;
      } catch (e) {
        console.log('Save failed to load');
      }
    }

    function saveState() {
      state.storeComplete = state.upgrades.every((upg) => upg.owned > 0);
      localStorage.setItem(saveKey, JSON.stringify(state));
    }

    function formatNumber(num) {
      if (!Number.isFinite(num)) return '∞';

      const scales = [
        [1e32, '100 nonillion+'],
        [1e30, 'nonillion'],
        [1e27, 'octillion'],
        [1e24, 'septillion'],
        [1e21, 'sextillion'],
        [1e18, 'quintillion'],
        [1e15, 'quadrillion'],
        [1e12, 'trillion'],
        [1e9, 'billion'],
        [1e6, 'million']
      ];

      const scale = scales.find(([value]) => num >= value);

      if (scale) {
        if (scale[0] === 1e32) return '100+ nonillion';

        return (
          Math.floor((num / scale[0]) * 10) / 10
        ).toFixed(1) + ' ' + scale[1];
      }

      return formatter.format(Math.floor(num));
    }

    function isUnlocked(upg) {
      return state.totalCoins >= upg.unlockAt;
    }

    function getMultiplier() {
      return state.feverActive ? 2 : 1;
    }

    function getRebirthMultiplier() {
      return 1 + (state.rebirths || 0) * 0.5;
    }

    function refreshHud() {
      coinEl.textContent = formatNumber(state.coins) + ' coins';

      tapText.textContent =
        '+' +
        formatNumber(state.perTap * getMultiplier()) +
        ' per tap';

      perTapStat.textContent = formatNumber(state.perTap);
      autoStat.textContent = formatNumber(state.autoPerSecond) + '/s';

      feverStat.textContent =
        Math.min(100, Math.round(state.feverMeter)) + '%';

      feverFill.style.width =
        Math.min(100, Math.max(0, state.feverMeter)) + '%';

      feverLabel.textContent =
        state.feverActive
          ? 'Fever time!'
          : state.feverMeter >= 100
            ? 'Fever ready'
            : 'Build fever';

      rebirthStat.textContent =
        formatNumber(state.rebirths || 0);

      updateRebirthButton();
    }

    function updateRebirthButton() {
      if (state.spaceUnlocked) {
        rebirthBtn.disabled = false;
        rebirthBtn.classList.add('space-ready');
        rebirthBtn.textContent = '🚀 Go to Space';
        rebirthNote.textContent = 'Your space adventure is ready!';
        return;
      }

      rebirthBtn.classList.remove('space-ready');

      if (state.coins >= REBIRTH_COST) {
        rebirthBtn.disabled = false;
        rebirthBtn.textContent = '♻️ Rebirth';
        rebirthNote.textContent =
          'Reset your farm and unlock the Space Pig world!';
      } else {
        rebirthBtn.disabled = true;
        rebirthBtn.textContent = '🔒 Rebirth';
        rebirthNote.textContent =
          'Reach 100 nonillion coins to unlock';
      }
    }

    function claimAchievement(id) {
      if (!state.readyAchievements[id] || state.achievements[id]) return;

      const def = state.achievementDefs.find((a) => a.id === id);

      if (!def) return;

      state.achievements[id] = true;
      delete state.readyAchievements[id];

      state.coins += def.reward;
      state.totalCoins += def.reward;

      playRewardSfx();

      refreshHud();
      checkAchievements();
      renderAchievements();
      saveState();
    }

    function isAchievementReady(ach) {
      if (ach.metric === 'totalCoins') {
        return state.totalCoins >= ach.goal;
      }

      if (ach.id === 'tapBoost') {
        return state.perTap >= ach.goal;
      }

      if (ach.id === 'autoCrew') {
        return state.upgrades
          .filter((upg) => upg.type === 'auto')
          .reduce((sum, upg) => sum + upg.owned, 0) >= ach.goal;
      }

      return ach.id === 'feverTime' && state.feverActive;
    }

    function checkAchievements() {
      let hasNewReadyAchievement = false;

      state.achievementDefs.forEach((ach) => {
        if (
          !state.achievements[ach.id] &&
          !state.readyAchievements[ach.id] &&
          isAchievementReady(ach)
        ) {
          state.readyAchievements[ach.id] = true;
          hasNewReadyAchievement = true;
        }
      });

      if (hasNewReadyAchievement) {
        renderAchievements();
      }
    }

    function addCoins(n) {
      state.coins += n;
      state.totalCoins += n;

      refreshHud();
      checkAchievements();

      renderStore();
      saveState();
    }

    const FEVER_BASE_TIME = 8;
    const FEVER_MAX_TIME = 12;
    const FEVER_TIME_PER_CLICK = 0.6;

    function addFever(amount) {
      if (state.feverActive) {
        state.feverTimer = Math.min(
          FEVER_MAX_TIME,
          state.feverTimer + FEVER_TIME_PER_CLICK
        );

        refreshHud();
        return;
      }

      state.feverMeter += amount;

      if (state.feverMeter >= 100) {
        state.feverMeter = 100;
        state.feverActive = true;
        state.feverTimer = FEVER_BASE_TIME;

        playRewardSfx();
      }

      refreshHud();
    }

    function updateFever(dt) {
      if (state.feverActive) {
        state.feverTimer -= dt;

        state.feverMeter = Math.max(
          0,
          Math.min(
            100,
            (state.feverTimer / FEVER_MAX_TIME) * 100
          )
        );

        if (state.feverTimer <= 0) {
          state.feverActive = false;
          state.feverTimer = 0;
          state.feverMeter = 0;
        }
      } else {
        state.feverMeter = Math.max(
          0,
          state.feverMeter - dt * 8
        );
      }

      refreshHud();
    }

    function doRebirth() {
      if (state.coins < REBIRTH_COST) return;

      state.rebirths = (state.rebirths || 0) + 1;
      state.spaceUnlocked = true;

      state.coins = 0;
      state.perTap = 1;
      state.pigs = 0;
      state.autoPerSecond = 0;
      state.feverMeter = 0;
      state.feverActive = false;
      state.feverTimer = 0;

      state.upgrades.forEach((upg) => {
        upg.owned = 0;
      });

      playRewardSfx();

      refreshHud();
      renderStore();
      renderAchievements();
      saveState();
    }

    function goToSpace() {
      if (!state.spaceUnlocked) return;

      window.location.href = 'pig-clicker-space.html';
    }

    function buyUpgrade(upg) {
      if (!isUnlocked(upg) || state.coins < upg.cost) return;

      state.coins -= upg.cost;
      upg.owned += 1;

      if (upg.type === 'tap') {
        state.perTap += upg.value;
      } else if (upg.type === 'auto') {
        state.autoPerSecond += upg.value;
      }

      state.pigs += 1;

      playBuySfx();

      refreshHud();
      renderStore();
      checkAchievements();
      saveState();
    }

    function renderStore() {
      storeEl.innerHTML = '';

      state.upgrades.forEach((upg) => {
        const unlocked = isUnlocked(upg);

        const row = document.createElement('div');

        row.className =
          'upg' + (unlocked ? '' : ' locked');

        const left = document.createElement('div');
        left.className = 'upg-info';

        const bonus =
          upg.type === 'auto'
            ? '+' + formatNumber(upg.value) + ' pigs/s'
            : '+' + formatNumber(upg.value) + ' click';

        const cost =
          upg.costLabel || formatNumber(upg.cost);

        const availability = unlocked
          ? 'Cost: ' + cost
          : upg.costLabel
            ? 'Cost: ' + cost + ' • Unlock: ' + formatNumber(upg.unlockAt)
            : 'Unlock: ' + formatNumber(upg.unlockAt);

        left.innerHTML =
          '<div class="upg-icon" aria-hidden="true">' +
          upg.icon +
          '</div>' +

          '<div class="upg-details">' +
          '<div class="upg-name">' +
          upg.name +
          '</div>' +

          '<div class="upg-cost">' +
          bonus +
          ' • ' +
          availability +
          ' • Owned: ' +
          upg.owned +
          '</div>' +

          '</div>';

        const btn = document.createElement('button');

        btn.className = 'upg-btn';
        btn.dataset.upgradeId = upg.id;

        btn.textContent =
          unlocked ? 'Buy' : 'Locked';

        btn.disabled =
          !unlocked ||
          state.coins < upg.cost;

        btn.addEventListener(
          'click',
          () => buyUpgrade(upg)
        );

        row.appendChild(left);
        row.appendChild(btn);

        storeEl.appendChild(row);
      });
    }

    function renderAchievements() {
      achievementsEl.innerHTML = '';

      state.achievementDefs.forEach((ach) => {
        const claimed =
          !!state.achievements[ach.id];

        const ready =
          !!state.readyAchievements[ach.id];

        const row = document.createElement('div');

        row.className =
          'achievement' +
          (claimed || ready ? '' : ' locked');

        const titleWrap = document.createElement('div');

        titleWrap.innerHTML =
          '<div class="title">' +
          ach.name +
          '</div>' +

          '<div class="reward">' +
          ach.description +
          ' • +' +
          formatNumber(ach.reward) +
          '</div>';

        const badge =
          document.createElement(
            ready && !claimed ? 'button' : 'div'
          );

        badge.className = 'badge';

        if (claimed) {
          badge.textContent = '✅';
        } else if (ready) {
          badge.className = 'upg-btn';
          badge.textContent = 'Claim';

          badge.addEventListener(
            'click',
            () => claimAchievement(ach.id)
          );
        } else {
          badge.textContent = '🔒';
        }

        row.appendChild(titleWrap);
        row.appendChild(badge);

        achievementsEl.appendChild(row);
      });
    }

    function makeBurst() {
      const burst = document.createElement('div');

      const value =
        state.feverActive
          ? state.perTap * 3
          : state.perTap;

      burst.className = 'burst';

      burst.textContent =
        '+' + formatNumber(value);

      burst.style.left = '50%';
      burst.style.top = '50%';

      pigEl.appendChild(burst);

      setTimeout(() => {
        burst.remove();
      }, 500);
    }

    pigEl.addEventListener('pointerdown', (event) => {
      event.preventDefault();

      ensureAudio();

      const gain =
        state.perTap *
        getMultiplier() *
        getRebirthMultiplier();

      addCoins(gain);
      addFever(10);

      playClickSfx();
      playOinkSfx();

      makeBurst();
    });

    rebirthBtn.addEventListener('click', () => {
      if (state.spaceUnlocked) {
        goToSpace();
      } else {
        doRebirth();
      }
    });

    homeBtn.addEventListener('click', () => {
      if (window.parent !== window) {
        window.parent.postMessage(
          { type: 'DougHub-home' },
          '*'
        );

        window.parent.postMessage(
          { type: 'pig-clicker-home' },
          '*'
        );
      } else {
        window.location.href = 'DougHub.html';
      }
    });

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'pig-clicker-reset') {
        state =
          JSON.parse(
            JSON.stringify(defaultState)
          );

        saveState();
        renderStore();
        renderAchievements();
        refreshHud();

      } else if (
        event.data?.type === 'pig-clicker-rebirth'
      ) {
        if (state.coins >= REBIRTH_COST) {
          doRebirth();
        }
      }
    });

    function gameLoop(ts) {
      if (!gameLoop.last) {
        gameLoop.last = ts;
      }

      const dt =
        Math.min(
          0.1,
          (ts - gameLoop.last) / 1000
        );

      gameLoop.last = ts;

      state.playTimeSeconds += dt;

      if (ts - lastStatsSave >= 5000) {
        lastStatsSave = ts;
        saveState();
      }

      if (state.autoPerSecond > 0) {
        const autoGain =
          state.autoPerSecond *
          (state.feverActive ? 3 : 1) *
          getRebirthMultiplier() *
          dt;

        addCoins(autoGain);
      }

      updateFever(dt);

      requestAnimationFrame(gameLoop);
    }

    window.addEventListener(
      'pointerdown',
      ensureAudio,
      { once: true }
    );

    loadState();
    renderStore();
    renderAchievements();
    refreshHud();

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
